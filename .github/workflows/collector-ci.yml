name: Collector CI

on:
  pull_request:
    paths:
      - "apps/collector/**"
      - ".github/workflows/collector-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/collector/**"
      - ".github/workflows/collector-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/collector
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Wrangler dry run
        run: npm run check
